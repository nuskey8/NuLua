[workspace]
resolver = "2"
members = ["lua51", "lua52", "lua53", "lua54", "lua55", "luajit", "luau"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
bindgen = "0.72.1"
cc = "1.2.64"
csbindgen = { git = "https://github.com/OleRoss/csbindgen.git", branch = "feat/include-negative-const-values" }
